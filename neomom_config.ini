# ==============================================================
# neomom_config.ini
# NeoMoM suite display configuration
#
# This file is read at startup by all NeoMoM GUI applications.
# Edit here to tune display scaling for your monitor setup.
# No recompiling or code editing required.
#
# Location: project root (same directory as README.md)
# ==============================================================

[display]

# ----------------------------------------------------------
# Windows HiDPI scaling correction
#
# Python reports logical pixels on Windows, so the OS display
# scaling factor cannot be detected automatically.
# Set this to match: Settings > System > Display > Scale
#
#   100% scaling  ->  win_os_scale = 1.0
#   125% scaling  ->  win_os_scale = 1.25   (common on 1440p)
#   150% scaling  ->  win_os_scale = 1.5
#   175% scaling  ->  win_os_scale = 1.75
#   200% scaling  ->  win_os_scale = 2.0    (common on 4K)
#
# This setting is ignored on Linux and macOS.
# ----------------------------------------------------------
win_os_scale = 1.25

# ----------------------------------------------------------
# Font base size override
#
# Set to 0 for automatic sizing based on screen resolution.
# Set to a positive integer (e.g. 10, 11, 12) to override
# the automatic font size on all plots across all GUIs.
#
# Useful when the auto-detected size is slightly off.
# ----------------------------------------------------------
font_base_override = 0

# ----------------------------------------------------------
# Linux resolution tier overrides
#
# Normally auto-detected from screen resolution.
# Uncomment and set manually if auto-detection is wrong.
#
# fig_polar_in controls plot window size in inches.
# mpl_dpi controls rendering resolution.
# font_base controls all text sizes on plots.
#
# Typical values:
#   1080p:  fig_polar_in=4.5  mpl_dpi=100  font_base=10
#   1440p:  fig_polar_in=5.5  mpl_dpi=120  font_base=11
#   4K:     fig_polar_in=6.0  mpl_dpi=200  font_base=10
# ----------------------------------------------------------
# fig_polar_in_override = 0
# mpl_dpi_override = 0
# linux_font_base_override = 0
